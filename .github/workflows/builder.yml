name: build
on:
  workflow_call:
    inputs:
      version:
        description: "版本号"
        required: true
        type: string
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: "false"
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: true
        default: "dev"
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: "false"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop-web:
    name: 构建桌面端前端资源
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: soloncode-desktop/package-lock.json

      - name: 构建桌面端前端
        working-directory: ./soloncode-desktop
        run: |
          npm ci
          npm run build

      - name: 上传桌面端前端产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: soloncode-desktop/dist

  build-cli-jar:
    name: 构建 CLI JAR 与发布包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置版本号
        run: |
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: 设置 JDK 环境
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 编译 CLI JAR 与发布包
        run: |
          chmod +x ./gradlew
          ./gradlew :soloncode-cli:shadowJar :soloncode-cli:releaseArchive
          ./gradlew --stop || true

      - name: 整理 CLI 产物
        run: |
          mkdir -p dist
          cp soloncode-cli/build/libs/soloncode-cli.jar "dist/soloncode-cli-v${VERSION}.jar"
          RELEASE_ARCHIVE=$(ls soloncode-cli/build/distributions/soloncode-cli-bin-v*.tar.gz | head -n 1)
          cp "$RELEASE_ARCHIVE" "dist/soloncode-cli-bin-v${VERSION}.tar.gz"
          ls -al dist

      - name: 上传 CLI JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/soloncode-cli-v${{ inputs.version }}.jar

      - name: 上传 CLI 发布包
        uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: dist/soloncode-cli-bin-v${{ inputs.version }}.tar.gz

  build-native:
    name: 构建原生可执行文件:${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            os_name: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            os_name: linux
          - os: macos-15-intel
            arch: x64
            os_name: macos
          - os: macos-15
            arch: arm64
            os_name: macos
          - os: windows-2025
            arch: x64
            os_name: windows

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: uname 信息
        run: |
          uname -a || systeminfo

      - name: 设置版本号
        run: |
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: 设置 GraalVM 环境
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 设置临时目录到当前工作目录
        run: |
          echo "TMP=$PWD/.tmp" >> $GITHUB_ENV
          echo "TEMP=$PWD/.tmp" >> $GITHUB_ENV
          mkdir -p .tmp

      - name: 编译 Native Image
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x ./gradlew
          fi
          ./gradlew :soloncode-cli:nativeCompile
          ./gradlew --stop || true

      - name: 整理 Native 产物
        run: |
          cd soloncode-cli/build/native/nativeCompile
          ARTIFACT_BASE="soloncode-cli-${{ matrix.os_name }}-${{ matrix.arch }}-v${VERSION}"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            mv soloncode-cli.exe "${ARTIFACT_BASE}.exe"
          else
            mv soloncode-cli "${ARTIFACT_BASE}"
            chmod +x "${ARTIFACT_BASE}"
          fi
          ls -al

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os_name }}-${{ matrix.arch }}
          path: soloncode-cli/build/native/nativeCompile/soloncode-cli-${{ matrix.os_name }}-${{ matrix.arch }}-v${{ inputs.version }}*
